name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    # Redeploys daily so the copyright year and the validity of the certifications,
    # which are computed at build time, stay exact even when there are no commits.
    schedule:
        - cron: '0 5 * * *'
    workflow_dispatch:

# Read-only by default: the jobs that install dependencies and build need nothing more.
# Publishing to Pages (`pages` and `id-token`) is allowed only to the `deploy` job.
permissions:
    contents: read

# One deployment at a time: the push and the daily cron do not trample each other, and the one already running finishes.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    # Nothing is published if the types or the tests (including data validation) fail:
    # `withastro/action` only builds, and a malformed YAML does not break the build on its own.
    # It also builds here to check the resulting HTML (CSP, SEO, links).
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run test:coverage
            - run: npm run build
            - run: npm run test:dist

    build:
        needs: verify
        runs-on: ubuntu-latest
        steps:
            - name: Checkout your repository using git
              uses: actions/checkout@v7
            - name: Install, build, and upload your site
              uses: withastro/action@v6

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
