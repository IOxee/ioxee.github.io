name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    # Redespliega a diario para que la edad y el año del copyright, que se calculan al
    # compilar, se mantengan exactos aunque no haya commits.
    schedule:
        - cron: '0 5 * * *'
    workflow_dispatch:

# Por defecto solo lectura: los jobs que instalan dependencias y compilan no necesitan más.
# Publicar en Pages (`pages` e `id-token`) lo permite únicamente el job `deploy`.
permissions:
    contents: read

# Un despliegue por vez: el push y el cron diario no se pisan, y el que ya está en curso termina.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    # Nada se publica si los tipos o los tests (incluida la validación de los datos) fallan:
    # `withastro/action` solo compila, y un YAML mal formado no rompe el build por sí solo.
    # Se compila aquí también para comprobar el HTML resultante (CSP, SEO, enlaces).
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run test:coverage
            - run: npm run build
            - run: npm run test:dist

    build:
        needs: verify
        runs-on: ubuntu-latest
        steps:
            - name: Checkout your repository using git
              uses: actions/checkout@v7
            - name: Install, build, and upload your site
              uses: withastro/action@v6

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
