# Certifications and courses that are NOT formal education (that goes in experience.yaml, `kind: education`).
# With none, the folder has neither that section nor its tab. While it is empty, the build warns
# "No items found in src/data/certifications.yaml": that is normal and goes away when you add the first one.
#
# Fields:
#   id        kebab-case, unique.
#   name      name of the certification or course.
#   issuer    who issues it (platform, academy, manufacturer…).
#   issued    when it was obtained: 'YYYY' or 'YYYY-MM' (quoted).
#   expires   when it expires, same format. If it does not expire, remove the line.
#   url       where its authenticity can be checked (https only). Optional.
#   summary   what it covers, in one sentence. Optional. Accepts es:, ca: and en: (only es: is required).
#   imageAlt  alt text of the photo, like summary. Optional: without it the site shows "Certificado: nombre".
#   order     position in the list (1 = first).
#
# The PHOTO and the DOCUMENT are not declared here: leave the files in src/assets/certifications/ named
# after the id (big-school-ai-starter.jpg, big-school-ai-starter.pdf) and they appear on their own. The photo is a
# thumbnail that opens large; the document, a "Ver documento (PDF)" link. png, jpg,
# jpeg, webp and pdf are accepted, with a lowercase extension and a single file of each type per certification;
# if a name matches no id, the build warns. Careful: a certificate usually carries the legal
# name, sometimes the national ID number and a QR code. Everything in the repository is public: cover whatever you
# do not want to show.
#
# Indentation uses spaces, never tabs (YAML does not accept them).
#
# Example (remove the # from each line and change the data):
# - id: example-course
#   name: Course name
#   issuer: Platform
#   issued: '2024-06'
#   expires: '2027-06'
#   url: https://example.com/verify/123
#   summary:
#       es: What it covers, in one sentence.
#   order: 1
- id: big-school-ai-starter
  name: INICIACIÓN AL DESARROLLO CON IA
  issuer: Big School
  issued: '2026-10'
  url: https://bigschool.com/certificates/ai-starter
  summary:
      es: Introducción a la inteligencia artificial y sus aplicaciones.
      en: Introduction to artificial intelligence and its applications.
  order: 1
