# Inventario de habilidades.
#
# `since`: año en que empezaste (los años de experiencia se calculan solos).
# `state`: daily = uso diario · comfortable = con soltura · learning = aprendiendo.
# `provisional: true`: el `since` es una estimación sin confirmar. La web NO enseña los
# años de las habilidades provisionales (solo su estado) hasta que borres esa línea.
#
# Los `state` salen de tus antiguos porcentajes (>=75 % → daily, 50-55 % → comfortable,
# <=35 % → learning); el único `since` firme es el de Lua (servidores FiveM desde 2018).
# Confirma o corrige cada habilidad y quita `provisional` al hacerlo.
- id: lua
  name: Lua
  category: backend
  since: 2018
  state: daily

