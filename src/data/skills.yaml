# Inventario de habilidades.
#
# `since`: año en que empezaste (los años de experiencia se calculan solos).
# `state`: daily = uso diario · comfortable = con soltura · intermediate = intermedio ·
#          basic = básico.
# `provisional: true`: el `since` es una estimación sin confirmar. La web NO enseña los
# años de las habilidades provisionales (solo su estado) hasta que borres esa línea.
#
# Los `state` de Lua, PHP, Java, C#, Python, Angular, Next.js, SQL y PostgreSQL los fijaste
# tú. Los de HTML, CSS y JavaScript siguen saliendo de tus antiguos porcentajes (>=75 % →
# daily, 50 % → comfortable): confírmalos. El único `since` firme es el de Lua (servidores
# FiveM desde 2022); el resto son estimaciones.
- id: lua
  name: Lua
  category: backend
  since: 2022
  state: comfortable

- id: csharp
  name: C#
  category: backend
  since: 2023
  state: daily
  provisional: true

