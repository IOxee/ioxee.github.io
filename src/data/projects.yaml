# Personal projects. They are shown from most recent to oldest according to `start` and `end`
# ('YYYY' or 'YYYY-MM'; `end: null` if still going): the file order does not count.
# Each project has its own folder, src/assets/projects/<id>/. Its screenshot is image.png (or .jpg, .jpeg,
# .webp) and its alt text goes in `imageAlt`.
# A project can also have a PDF: leave document.pdf in that folder and a "Ver documento (PDF)" link appears
# beside the repository link. document.pdf is the Spanish one and the fallback for every language; add
# document.en.pdf or document.ca.pdf and that language links to its own translation instead.
# Lowercase names; a file that does not follow this layout fails the build and the error names it.
# A project with `details` carries a second page: the challenge, the points and a closing sentence.
- id: cubezon
  name: Cubezon
  summary:
      es: 'Marketplace web conectado a un servidor de Minecraft. Los jugadores ponen a la venta objetos del juego en la web, el comprador paga con el dinero del servidor y recoge el pedido en una taquilla dentro del juego. Hice el plugin del servidor y la web.'
      ca: 'Marketplace web connectat a un servidor de Minecraft. Els jugadors posen a la venda objectes del joc a la web, el comprador paga amb els diners del servidor i recull la comanda en una taquilla dins del joc. Vaig fer el plugin del servidor i la web.'
      en: "Web marketplace connected to a Minecraft server. Players list in-game items for sale on the website, the buyer pays with the server's money and picks up the order from a locker inside the game. I built the server plugin and the website."
  stack:
      - Java 21 + Paper
      - Next.js 16 + React 19 + TypeScript
      - PostgreSQL (Supabase)
      - 336 tests
      - CI con GitHub Actions
  repo: https://github.com/IOxee/Cubezon
  imageAlt:
      es: 'Portada de la tienda de Cubezon: el buscador, las categorías del juego y los tres pasos para comprar (vincular la cuenta, elegir y pagar, recoger en la taquilla).'
      ca: 'Portada de la botiga de Cubezon: el cercador, les categories del joc i els tres passos per comprar (vincular el compte, triar i pagar, recollir a la taquilla).'
      en: 'Cubezon shop cover: the search bar, game categories, and the three steps to buy (link the account, choose and pay, pick up from the locker).'
  start: '2026-10'
  end: '2026-10'
  details:
      intro:
          es: 'Lo difícil era que la web y el servidor compartieran dinero e inventarios sin duplicar nada aunque algo fallara a mitad:'
          ca: 'El difícil era que la web i el servidor compartissin diners i inventaris sense duplicar res encara que alguna cosa fallés a mig camí:'
          en: 'The hard part was making the website and the server share money and inventories without duplicating anything, even if something failed halfway:'
      points:
          es:
              - El plugin es la única autoridad sobre saldos e inventarios; la web solo crea pedidos.
              - Cada pedido pasa por estados (PENDING → PAID → READY → COLLECTED), cada paso en su propia transacción. Un pedido interrumpido se marca para revisión y nunca se cobra dos veces.
              - 'El pago al vendedor se registra antes de abonarlo: si falla, queda pendiente, nunca duplicado.'
              - Solo se vende lo que el vendedor depositó antes en el juego (escrow, una fila por unidad).
              - Row Level Security en todas las tablas y permisos comprobados en SQL.
          ca:
              - El plugin és l'única autoritat sobre saldos i inventaris; la web només crea comandes.
              - Cada comanda passa per estats (PENDING → PAID → READY → COLLECTED), i cada pas va en la seva pròpia transacció. Una comanda interrompuda es marca per revisar i mai es cobra dues vegades.
              - "El pagament al venedor es registra abans d'abonar-lo: si falla, queda pendent, mai duplicat."
              - Només es ven allò que el venedor havia dipositat abans al joc (escrow, una fila per unitat).
              - Row Level Security a totes les taules i permisos comprovats en SQL.
          en:
              - The plugin is the only authority over balances and inventories; the website only creates orders.
              - Each order moves through states (PENDING → PAID → READY → COLLECTED), with every step in its own transaction. An interrupted order is flagged for review and is never charged twice.
              - 'The seller payout is recorded before the money is sent: if it fails, it stays pending, never duplicated.'
              - Only what the seller previously deposited in the game can be sold (escrow, one row per unit).
              - Row Level Security on every table and permissions checked in SQL.
      closing:
          es: También hice los paneles de vendedor y de administración, un modo roleplay (empleados, rangos, ordenador de empresa, repartidores con comisión y propina) y el diseño, con modo claro y oscuro.
          ca: També vaig fer els panells de venedor i d'administració, un mode roleplay (empleats, rangs, ordinador d'empresa, repartidors amb comissió i propina) i el disseny, amb mode clar i fosc.
          en: I also built the seller and admin panels, a roleplay mode (employees, ranks, a company computer, delivery riders with commission and tips) and the design, with light and dark modes.

- id: trellord-connector
  name: Trellord Connector
  summary:
      es: Servicio en JavaScript que conecta Trello con Discord. Detecta los cambios en tableros, listas y tarjetas y los publica en canales de Discord, para seguir el trabajo del equipo sin tener que abrir Trello.
      ca: Servei en JavaScript que connecta Trello amb Discord. Detecta els canvis en taulers, llistes i targetes i els publica en canals de Discord, per seguir la feina de l'equip sense haver d'obrir Trello.
      en: JavaScript service that connects Trello to Discord. It detects changes in boards, lists and cards and posts them to Discord channels, so the team can follow the work without opening Trello.
  stack:
      - JavaScript
      - Trello API
      - Discord webhooks
  repo: https://github.com/IOxee/TrellordConnector
  imageAlt:
      es: 'Terminal con el logotipo en ASCII de Fractal Game Studios y el mensaje «Server started» al arrancar la herramienta.'
      ca: "Terminal amb el logotip en ASCII de Fractal Game Studios i el missatge «Server started» en arrencar l'eina."
      en: 'Terminal with the Fractal Game Studios ASCII logo and the message «Server started» when the tool starts.'
  start: '2023-12'
  end: '2024-04'
  details:
      intro:
          es: 'Lo hice para que los cambios de Trello llegaran solos a Discord, con el contexto necesario para no tener que ir al tablero:'
          ca: "El vaig fer perquè els canvis de Trello arribessin sols a Discord, amb el context necessari per no haver d'anar al tauler:"
          en: 'I built it so that Trello changes would reach Discord on their own, with enough context not to have to open the board:'
      points:
          es:
              - Recibe los cambios de Trello y los convierte en mensajes de Discord.
              - Puede seguir varios proyectos a la vez; los avisos de cada uno van por separado.
              - Publica los mensajes en el canal configurado mediante webhooks.
          ca:
              - Rep els canvis de Trello i els converteix en missatges de Discord.
              - Pot seguir diversos projectes alhora; els avisos de cadascun van per separat.
              - Publica els missatges al canal configurat mitjançant webhooks.
          en:
              - Receives Trello changes and turns them into Discord messages.
              - Can follow several projects at once, keeping each one's notifications separate.
              - Posts the messages to the configured channel through webhooks.

- id: animal-crossing-api-wrapper
  name: Nookphone - Animal Crossing
  summary:
      es: App móvil hecha con Ionic y Angular que consulta la API pública de Animal Crossing y muestra sus datos con una interfaz que imita el NookPhone del juego.
      ca: App mòbil feta amb Ionic i Angular que consulta l'API pública d'Animal Crossing i en mostra les dades amb una interfície que imita el NookPhone del joc.
      en: Mobile app built with Ionic and Angular that queries the public Animal Crossing API and shows its data with an interface that mimics the game's NookPhone.
  stack:
      - Ionic 6
      - Angular 14
      - TypeScript
      - SCSS
  repo: https://github.com/IOxee/Animal_Crossing_API_Wrapper
  imageAlt:
      es: 'Interfaz «Nook Phone»: una cuadrícula de iconos redondeados con las secciones de Animal Crossing.'
      ca: "Interfície «Nook Phone»: una quadrícula d'icones arrodonides amb les seccions d'Animal Crossing."
      en: 'Nook Phone interface: a grid of rounded icons with the Animal Crossing sections.'
  start: '2023-01'
  end: '2023-02'
  details:
      intro:
          es: 'La hice para consultar los datos del juego desde el móvil, con una interfaz parecida a la del teléfono que sale en él:'
          ca: 'La vaig fer per consultar les dades del joc des del mòbil, amb una interfície semblant a la del telèfon que hi surt:'
          en: "I made it to look up the game's data from a phone, with an interface like the phone that appears in the game:"
      points:
          es:
              - Pide los datos a la API pública de Animal Crossing y los organiza por secciones.
              - 'La pantalla de inicio imita el NookPhone: una cuadrícula de iconos, uno por sección.'
              - Está hecha con Ionic 6 y Angular 14, en TypeScript, con los estilos en SCSS.
          ca:
              - Demana les dades a l'API pública d'Animal Crossing i les organitza per seccions.
              - "La pantalla d'inici imita el NookPhone: una quadrícula d'icones, una per secció."
              - Està feta amb Ionic 6 i Angular 14, en TypeScript, amb els estils en SCSS.
          en:
              - Fetches data from the public Animal Crossing API and organizes it by section.
              - 'The home screen mimics the NookPhone: a grid of icons, one per section.'
              - Built with Ionic 6 and Angular 14, in TypeScript, with styles in SCSS.
